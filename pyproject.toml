[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Golden-case evals for tool-using agents: safety failures block the merge, quality flakes re-roll, outages never read as safety, and nightly runs track drift."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Brandon Oscar" }]
keywords = ["evals", "llm", "agents", "testing", "ci", "llm-as-judge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# No dependencies: cases are JSON, the target is your own async function.
dependencies = []

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.24,<0.25"]
dev = [
    "openai-agents>=0.24,<0.25",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[project.urls]
Source = "https://github.com/brandonoscar/agent-eval-harness"
Issues = "https://github.com/brandonoscar/agent-eval-harness/issues"
Changelog = "https://github.com/brandonoscar/agent-eval-harness/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]
