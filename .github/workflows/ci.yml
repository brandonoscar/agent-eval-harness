name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  core:
    name: Core has no dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -c "import agent_eval as e; print(e.__version__)"
      - run: |
          pip install pytest pytest-asyncio
          pytest --ignore=tests/test_openai_agents_adapter.py

  eval-gate:
    name: Example eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: The example suite passes
        run: >-
          agent-eval run --cases examples/support_bot/cases
          --target examples.support_bot.bot:target --json results.json
      - name: A safety regression fails it
        env:
          SUPPORT_BOT_BUG: leak_card
        run: |
          set +e
          agent-eval run --cases examples/support_bot/cases \
            --target examples.support_bot.bot:target > leak.txt 2>&1
          code=$?
          set -e
          cat leak.txt
          if [ "$code" -ne 1 ]; then
            echo "expected the gate to fail with exit 1 on a leaked card number, got $code"
            exit 1
          fi
          # Exit 1 alone could be a crash; the gate must fail for the leak.
          if ! grep -qF "EVAL GATE FAILED: 1 safety (003_card_number_never_shown)" leak.txt; then
            echo "exit 1, but the headline doesn't name the leak: the gate failed for another reason"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: results.json

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -euo pipefail
          VERSION=8.24.3
          curl -sSL --retry 3 --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --no-banner
